[include]
files = [
    "monitor.toml",
    "env.toml",
    "keybindings.toml",
    "general.toml",
    "appearance.toml",
    "window_rule.toml",
    "layer_rule.toml",
    "effects.toml",
    "input.toml",
    "/usr/share/umbriel/effects/screen/vignette/effect.toml",
    "/usr/share/umbriel/effects/border/pulse/effect.toml",
    "/usr/share/umbriel/effects/animation/reveal/effect.toml",
    "/usr/share/umbriel/effects/cursor/glow/effect.toml",
    "/usr/share/umbriel/effects/cursor/trail/effect.toml",
    "/usr/share/umbriel/effects/cursor/trail-path/effect.toml",
    "/usr/share/umbriel/effects/window/scanlines/effect.toml"
]

[include.optional]
files = ["noctalia.toml"]

[input.keyboard]
numlock_toggle = true

[layout]
mode = "scrolling"
extent_presets = [0.333, 0.5, 0.667]

[layout.stacking]

[layout.scrolling]
default_extent_fraction = 0.5




[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

